[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-security-scanner"
version = "0.1.0"
description = "Read-only security auditing toolkit for Linux infrastructure, containers, and IaC"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
